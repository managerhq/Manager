name: Release

on:
  push:
    tags:
    - '[0-9]*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Verify the tag is on main
      run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

    - name: Create the draft release
      run: gh release create "$VERSION" --repo ${{ github.repository }} --draft --notes "$(git tag -l --format='%(contents)' "$VERSION")"

  server:
    needs: create-release
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    defaults:
      run:
        shell: bash
        working-directory: ManagerServer
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish ${{ matrix.runtime }}
      run: dotnet publish ManagerServer.csproj --configuration Release --runtime ${{ matrix.runtime }} --self-contained true /p:PublishSingleFile=true /p:DebugType=embedded /p:AssemblyVersion="$VERSION" --output out/${{ matrix.runtime }}

    - name: Archive ${{ matrix.runtime }}
      run: |
        case "${{ matrix.runtime }}" in
          win-*)
            7z a ManagerServer-${{ matrix.runtime }}.zip ./out/${{ matrix.runtime }}/*
            ;;
          linux-*)
            chmod a+x out/${{ matrix.runtime }}/ManagerServer
            tar -czf ManagerServer-${{ matrix.runtime }}.tar.gz -C out/${{ matrix.runtime }} .
            ;;
          osx-*)
            chmod a+x out/${{ matrix.runtime }}/ManagerServer
            7z a ManagerServer-${{ matrix.runtime }}.zip ./out/${{ matrix.runtime }}/*
            ;;
        esac

    - name: Upload to the release
      run: gh release upload "$VERSION" ManagerServer-${{ matrix.runtime }}.* --repo ${{ github.repository }} --clobber

  desktop-linux:
    needs: create-release
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ManagerDesktop
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: ManagerDesktop/package-lock.json

    # Build the server straight into the packaging folder so this job does not
    # have to wait for the server job to finish.
    - name: Publish the server
      run: |
        dotnet publish ../ManagerServer/ManagerServer.csproj --configuration Release --runtime linux-x64 --self-contained true /p:PublishSingleFile=true /p:DebugType=embedded /p:AssemblyVersion="$VERSION" --output ManagerServer
        chmod a+x ManagerServer/ManagerServer

    - run: npm ci
    - run: npm version "$VERSION" --no-git-tag-version
    - run: npm run dist -- --linux AppImage --x64
    - run: gh release upload "$VERSION" dist/*.AppImage --repo ${{ github.repository }} --clobber

  desktop-windows:
    needs: create-release
    timeout-minutes: 20
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: 4e7f81f9-175d-46fc-b5f0-e4f1601bd881
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: c3bea064-a905-402b-a65b-2d1e8799e5fd
      BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        shell: bash
        working-directory: ManagerDesktop
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: ManagerDesktop/package-lock.json

    - name: Publish the server
      run: dotnet publish ../ManagerServer/ManagerServer.csproj --configuration Release --runtime win-x64 --self-contained true /p:PublishSingleFile=true /p:DebugType=embedded /p:AssemblyVersion="$VERSION" --output ManagerServer

    - run: npm ci
    - run: npm version "$VERSION" --no-git-tag-version
    - run: npm run dist -- --win appx
    - run: gh release upload "$VERSION" dist/*.appx --repo ${{ github.repository }} --clobber

  desktop-mac:
    needs: create-release
    timeout-minutes: 30
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        shell: bash
        working-directory: ManagerDesktop
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: ManagerDesktop/package-lock.json

    - name: Publish the server
      run: |
        dotnet publish ../ManagerServer/ManagerServer.csproj --configuration Release --runtime osx-${{ matrix.arch }} --self-contained true /p:PublishSingleFile=true /p:DebugType=embedded /p:AssemblyVersion="$VERSION" --output ManagerServer
        chmod a+x ManagerServer/ManagerServer

    - run: npm ci

    - run: echo "$MAC_CERT_P12_BASE64" | base64 --decode > signing.p12
      env:
        MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}

    - run: echo "${{ secrets.APPLE_API_KEY_P8 }}" > "${{ github.workspace }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"

    - run: npm version "$VERSION" --no-git-tag-version

    - run: npm run dist -- --mac --${{ matrix.arch }}
      env:
        CSC_LINK: ${{ github.workspace }}/ManagerDesktop/signing.p12
        APPLE_API_KEY: "${{ github.workspace }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

    - run: gh release upload "$VERSION" dist/*.dmg --repo ${{ github.repository }} --clobber

  publish-release:
    timeout-minutes: 5
    needs:
    - server
    - desktop-linux
    - desktop-windows
    - desktop-mac
    runs-on: ubuntu-latest
    steps:
    - run: gh release edit "$VERSION" --repo ${{ github.repository }} --draft=false
